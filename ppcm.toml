# Prosper or Perish rules for Construction Manager: the numbers the generated pickers and the rules read.
# The rules follow Prosper or Perish's Construction Plan (constructor branch location-profiles, 2026-11-08/09, Jan):
# the store "a year from now" (this year's harvest and spoilage taken out), farms by payback, kitchens by the Cookshop
# budget, Taverns in famine, Granges on full stores, Victualling Yards by payback, Granaries while a store has little
# room, improvements where people fill a location's capacity.

[rules]
farm_sites_per_province = 4   # food: locations tried for a staple food maker, best payback first
hungry_months = 6             # food: a farm (or a Tavern where none can be built) where a normal year leaves less than this a year from now
famine_months = 3             # food: a Tavern first where a normal year leaves less than this in the store a year from now
granary_capacity_months = 24  # Granary: while the province can store less than this many months of its consumption
granary_fill_pct = 85         # Granary: and its store is at least this full, in %, and a normal year still adds food
grange_surplus_pct = 5        # Grange: the store holds 24 months and a normal month still adds this share of consumption
yard_payback_years = 10       # Victualling Yard: next level while it pays back within this; a first one where victuals cost their default price or more
tavern_victuals = 10          # a Tavern only where its market holds at least this much victuals
access_threshold = 97         # logistics: default line, market access in % without event effects (a Construction Manager setting)
improve_fill_pct = 90         # improvements: default line, population in % of capacity (a Construction Manager setting, steps of 10)
construction_goods_months = 12  # stage a construction only where its market holds this many months of its goods draw
access_blacklist = ["staple_port_commercial_stagnation_modifier"]
kitchens = ["public_kitchen", "cookshop"]
taverns = ["tavern"]
granaries = ["granary"]
granges = ["grange"]
yards = ["victualling_yard"]
logistics_order = ["river_boatmen_yard", "coastal_shipping_office", "transport_office", "carrier_inn", "pp_caravanserai", "pp_oasis_caravan_station", "pp_yam_station", "pp_banjara_tanda", "pp_llama_caravan_post"]
hidden_goods = ["offset", "logistics", "local_food", "manual_labor", "province_food_sales"]
