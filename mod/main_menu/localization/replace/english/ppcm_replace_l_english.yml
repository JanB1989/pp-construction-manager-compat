l_english:
  # Prosper or Perish rules for Construction Manager: CM's Auto-Food row runs Prosper or Perish's food rule
  cm__priority_list_i5_name: "Auto-Food (Prosper or Perish)"
  cm__priority_list_i5_desc: "Prosper or Perish's food rule, one construction a month in each [province|e], the first of these that applies. A year from now means the store a normal year would leave: this year's harvest and the spoiling food are taken out.\n• a year from now close to empty: a [ShowBuildingTypeName('tavern')|e] level, where its market holds victuals\n• a year from now short: a level of the farm, orchard, fishery, herd or forest village that pays back fastest there\n• a [ShowBuildingTypeName('cookshop')|e] or [ShowBuildingTypeName('public_kitchen')|e] level whenever it can be built\n• short and no farm possible: a [ShowBuildingTypeName('tavern')|e] level\n• a [ShowBuildingTypeName('grange')|e] level where the store is full and still grows\n• a [ShowBuildingTypeName('victualling_yard')|e] level while it pays back\nA location whose Auto-Food button is switched off is left out. The Auto-Food tab's lists of foods have no effect. Uses the Min Discount beside it and your Gold Reserve."
